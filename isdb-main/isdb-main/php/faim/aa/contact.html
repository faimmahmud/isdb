<header class="contact-hero">
  <div class="container">
    <div class="row g-4 align-items-center">
      <div class="col-lg-6 reveal">
        <p class="section-kicker">Let’s Talk</p>
        <h1 class="page-title">Design A Journey Worth Remembering</h1>
        <p class="page-text">
          A softer, more editorial contact page with a premium form, brand story, and visual gallery.
        </p>
      </div>
      <div class="col-lg-6 reveal">
        <div class="contact-panel">
          <form id="contactForm" action="submit.php" method="post">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" name="phone">
              </div>
              <div class="col-md-6">
                <label class="form-label">Destination</label>
                <input type="text" class="form-control" name="destination" required>
              </div>
              <div class="col-12">
                <label class="form-label">Message</label>
                <textarea class="form-control" name="message" rows="5" required></textarea>
              </div>
              <div class="col-12 d-grid">
                <button type="submit" class="btn btn-emerald btn-lg">Send Inquiry</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
