<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joining Form</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <form class="p-4 bg-white rounded shadow">

        <h2>A ABC Limited – Global</h2>
        <u><b>Officially joining required</b></u>

        <!-- First Name -->
        <div class="mb-3 mt-3">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control"
                   data-bs-toggle="tooltip"
                   title="Enter your first name">
        </div>

        <!-- Last Name -->
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control"
                   data-bs-toggle="tooltip"
                   title="Enter your last name">
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control"
                   data-bs-toggle="tooltip"
                   title="Enter a valid email address">
            <div class="form-text">We'll never share your email.</div>
        </div>

        <!-- Address -->
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" rows="4"
                      data-bs-toggle="tooltip"
                      title="Enter your full address"></textarea>
        </div>

        <!-- Branch -->
        <div class="mb-3">
            <label class="form-label">Joining Branch</label>
            <select class="form-select"
                    data-bs-toggle="tooltip"
                    title="Select your preferred branch">
                <option>Dhaka</option>
                <option>Kushtia</option>
                <option>Dhanmondi</option>
                <option>Rajshahi</option>
            </select>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control"
                   data-bs-toggle="tooltip"
                   title="Create a strong password">
        </div>

        <!-- Skills -->
        <div class="mb-3">
            <h5>Your Skills</h5>
            <div class="form-check">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">HTML</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">Java</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">Other Programs</label>
            </div>
        </div>

        <!-- Joining Type -->
        <div class="mb-3">
            <h5>Joining As</h5>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="join">
                <label class="form-check-label">Student</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="join">
                <label class="form-check-label">Job</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="join">
                <label class="form-check-label">Others</label>
            </div>
        </div>

        <!-- File -->
        <div class="mb-3">
            <label class="form-label">File Upload</label>
            <input type="file" class="form-control"
                   data-bs-toggle="tooltip"
                   title="Upload your CV or document">
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-primary"
                data-bs-toggle="tooltip"
                title="Submit the form">
            Submit
        </button>

        <button type="reset" class="btn btn-danger">Reset</button>

        <!-- Modal Button -->
        <button type="button" class="btn btn-info"
                data-bs-toggle="modal"
                data-bs-target="#joinModal">
            delete
        </button>

    </form>
</div>

<!-- Modal -->
<div class="modal fade" id="joinModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">are you sure?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p>
                press to delete
                </p>
            </div>

            <div class="modal-footer">
                <button>
                   
                </button>
                
            </div>

        </div>
    </div>
</div>

<script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

<!-- Tooltip Initialization -->
<script>
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));
</script>

</body>
</html>
