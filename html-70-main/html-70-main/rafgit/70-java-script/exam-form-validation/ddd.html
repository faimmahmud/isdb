<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>third exm</title>
</head>

<body>

    <fieldset>
        <legend>
            <h2>Student Details</h2>
        </legend>

        <form name="frm">


            <label>Name</label><br>
            <input type="text" name="name"><br><br>

            <label>email</label><br>
            <input type="email" name="eml"><br>

            <label>Password</label><br>
            <input type="text" name="pass"><br>
            <br>

            <label for="">Department</label>
            <select name="depertment">
                <option value="BSC">BSC</option>
                <option value="MBA">MBA</option>
                <option value="MSC">MSC</option>
            </select>

            <br><br>

            <!-- Checkbox -->
            <label for="">Course</label>
            <input type="checkbox" name="dg" value="SSC"> SSC
            <input type="checkbox" name="dg" value="HSC"> HSC
            <input type="checkbox" name="dg" value="BSC"> BSC

            <br><br>

            <!-- Radio -->
            <label for="">Gender</label>
            <input type="radio" name="gndr" value="Male"> Male
            <input type="radio" name="gndr" value="Female"> Female
            <input type="radio" name="gndr" value="Other"> Other

            <br><br>

            <input type="button" value="submit" onclick="show()">
            <input type="reset" value="reset">

        </form>
    </fieldset>
    <script>
        function show() {
            let name = document.forms['frm']['name'].value;
            let eml = document.forms['frm']['eml'].value;
            let pass = document.forms['frm']['pass'].value;
            let depertment = document.forms['frm']['depertment'].value;
            // let dg = document.forms['frm']['dg'].value;
            // let gndr = document.forms['frm']['gndr'].value;



            if (name == '') {
                alert('enter name first');
                return false;
            }
            if (eml == '') {
                alert('enter email first');
                return false;

            }
            if (eml.indexOf('@') == -1 || eml.indexOf('.') == -1) {
                alert('your email is invalil')
                return false;
            }

            if (pass == '') {
                alert('enter password first')
                return false;
            }

            if (pass.length < 4 || pass.length > 8) {
                alert('Password must be between 4 and 8 characters');
                return true;

            }
            /* check box */
        const NewDegree = document.querySelectorAll('input[name="dg"]:checked');

        let updg = "" ;
        for (let dec of NewDegree ){
            updg += dec.value + ", ";

        }
        updg = updg?updg.slice(0, -2) : "none";



        // gender

        const gender = document.querySelector('input[name="gndr"]:checked')?.value ?? 'not selected';
        

        let windows = window.open("","","width = 400, height = 500");
        windows.document.write(`
        <p>name: ${name}</p>
        <p>email: ${eml}</p>
        <p>password:${pass}</p>
        <p>depertment:${depertment}</p>
        <p>degree:${updg}</p>
        <p>gender:${gender}</p>

        `)
        }
    </script>

</body>

</html>
