<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        form {
            max-width: 400px;
            margin: auto;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        input[type="submit"] {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form id="registrationForm" onsubmit="return validateForm()">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Enter password"><br>

        <label for="email">Email:</label><br>
        <input type="text" id="email" name="email" placeholder="Enter your email"><br>

        <input type="submit" value="Register">
    </form>

    <script>
        function validateForm() {
            const name = document.getElementById("name").value.trim();
            const password = document.getElementById("password").value;
            const email = document.getElementById("email").value.trim();

            // Validate Name
            if (name === "") {
                alert("Name field must not be empty.");
                return false;
            }

            // Validate Password length
            if (password.length < 5 || password.length > 8) {
                alert("Password must be between 5 and 8 characters.");
                return false;
            }

            // Validate Email contains 'e' and '.'
            if (!email.includes("e") || !email.includes(".")) {
                alert("Email must contain 'e' and '.'");
                return false;
            }

            // Open new window to display info
            const resultWindow = window.open("", "ResultWindow", "width=400,height=300");
            resultWindow.document.write(`
                <html>
                <head>
                    <title>Registration Details</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; }
                        h2 { color: green; }
                    </style>
                </head>
                <body>
                    <h2>Registration Successful!</h2>
                    <p><strong>Name:</strong> ${name}</p>
                    <p><strong>Password:</strong> ${password}</p>
                    <p><strong>Email:</strong> ${email}</p>
                </body>
                </html>
            `);
            resultWindow.document.close();

            return false; // Prevent form from submitting normally
        }''
    </script>

</body>
</html>
