      1//  Smallest Number, Largest Number & Sum of Array

    let arr = [4, 5, 8, 68, 79, 1];

let smallest = arr[0];
let largest = arr[0];
let sum = 0;

for (let i = 0; i < arr.length; i++) {
    if (arr[i] < smallest) {
        smallest = arr[i];
    }
    if (arr[i] > largest) {
        largest = arr[i];
    }
    sum += arr[i];
}

console.log("Smallest:", smallest);
console.log("Largest:", largest);
console.log("Sum:", sum);
