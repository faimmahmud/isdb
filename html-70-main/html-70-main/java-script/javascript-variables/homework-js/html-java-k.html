<!DOCTYPE html>

<body>
    <script>

                    let num = 7;   // Change number here
            let count = 0;

            for (let i = 1; i <= num; i++) {
                if (num % i === 0) {
                    count++;
                }
            }

            if (count === 2) {
                console.log(num + " is a Prime Number");
            } else {
                console.log(num + " is NOT a Prime Number");
            }


    </script>
    <p></p>
</body>
