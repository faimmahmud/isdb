<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
   <script>
    let num = Number(prompt('enter number'));
    let isPrime = true;

    if (num <= 1){
        isPrime = false;
    }
    else{ 
        for (let i = 2 ; i < num ; i++){
          if ( num % i === 0){
            isPrime = false;
            break;
          }
        }
        if (isPrime){
            document.write(num + " is prime number" );
            
        }

        else { 
                document.write(num + " not prime numer");
            }
    }
   </script>

</body>
</html>
