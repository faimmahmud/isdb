<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = Number(prompt('enter number'));
        let isprime = true;

        if (num <= 1){
            isprime = false
        }
        else{
            for(let i = 2; i <= num ; i ++){
                num % i === 0 ;{
                    isprime = false
                break;
            }
}
        if (isprime){
            document.write(num + "is prime number");
        }
        else {
            document.write(num + "is not prime number");
        }

        }
    </script>
</body>
</html>
