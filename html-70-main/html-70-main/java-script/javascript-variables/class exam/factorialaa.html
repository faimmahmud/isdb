<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = Number(prompt('enter number'));
        let fact = 1;

        if (num < 0){
            document.write('not factorial')
        }

        else {
            for(let i = 1; i <= num ;i++){
                 fact *= i;
            }
            document.write(num +  ' factorial number is ' + fact);
        }

    </script>
</body>
</html>
